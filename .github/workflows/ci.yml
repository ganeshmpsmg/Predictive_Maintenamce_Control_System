name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic demo data
        run: |
          python data/generate_synthetic_data.py
          python data/generate_live_fleet_sample.py

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Lint (syntax check all modules)
        run: |
          python -m py_compile preprocessing.py feature_engineering.py failure_prediction.py \
            rul_prediction.py anomaly_detection.py maintenance_engine.py explainability.py \
            utils.py train.py predict.py app.py api/main.py

  # Optional second job: full training smoke-test (slower, so kept separate)
  train-smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate data and run a small training pass
        run: |
          python data/generate_synthetic_data.py
          python train.py --sample 1500 --lstm-epochs 3 --ae-epochs 3 --no-mlflow

      - name: Run inference smoke test
        run: |
          python data/generate_live_fleet_sample.py
          python predict.py --data data/live_fleet_snapshot.csv --output reports/ci_predictions.csv
